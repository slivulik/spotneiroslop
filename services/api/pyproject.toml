[project]
name = "sonora-api"
version = "0.1.0"
description = "Sonora core API: auth, catalog, library, streaming URLs."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "gunicorn>=23",
    "uvicorn-worker>=0.4",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "email-validator>=2.3",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "pgvector>=0.4",
    "redis>=7.0",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.10",
    "structlog>=25.4",
    "orjson>=3.11",
    "boto3>=1.40",
    "dramatiq[redis]>=1.18",
    "pillow>=11.3",
    "numpy>=2.3",
    "python-multipart>=0.0.20",
]

[project.scripts]
sonora-api = "sonora_api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
    "boto3-stubs[s3]>=1.40",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonora_api"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "PL", "TRY", "DTZ", "PERF"]
ignore = [
    "PLR0913",  # FastAPI handlers legitimately take many dependencies
    "TRY003",   # explicit error messages at raise sites are clearer here
    "PLR2004",  # magic values are fine in tests and HTTP status checks
    "PLR0917",  # FastAPI handlers receive dependencies positionally by design
    "RUF001", "RUF002", "RUF003",  # Russian-language product: Cyrillic in strings/comments is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "PLR2004"]
"migrations/**" = ["E501", "PLR0915"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations", "scripts"]
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
