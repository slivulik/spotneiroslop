name: android

on:
  push:
    paths: ["apps/android/**", "packages/design-tokens/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "packages/design-tokens/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Design tokens are up to date in the app
        working-directory: .
        run: |
          pnpm install --frozen-lockfile --filter @sonora/design-tokens...
          pnpm --filter @sonora/design-tokens build
          diff -u packages/design-tokens/dist/kotlin/SonoraTokens.kt apps/android/app/src/main/java/com/sonora/app/core/designsystem/tokens/SonoraTokens.kt
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Build APK (debug) and AAB (release)
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sonora-android
          path: |
            apps/android/app/build/outputs/apk/**/*.apk
            apps/android/app/build/outputs/bundle/**/*.aab
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
