# Temporary helper for the team/v2 branch: regenerates the OpenAPI document and the typed TS client
# from the API code and commits them back to the branch when they changed. Removed before merging.
name: regen-schema

on:
  push:
    branches: [team/v2]
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Export OpenAPI from the API
        working-directory: services/api
        run: |
          uv sync --frozen
          uv run python scripts/export_openapi.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Generate the TS client
        run: |
          pnpm install --frozen-lockfile --filter @sonora/api-schema...
          pnpm --filter @sonora/api-schema run generate
      - name: Commit when changed
        run: |
          git add packages/api-schema/openapi.json packages/api-schema/src/schema.gen.ts
          if git diff --cached --quiet; then echo "schema up to date"; exit 0; fi
          git -c user.name="sonora-ci" -c user.email="ci@sonora.invalid" commit -m "chore(api-schema): regenerate OpenAPI document and TS client"
          git push origin HEAD:${GITHUB_REF_NAME}
