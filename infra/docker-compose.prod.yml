# Production stack for a single VPS. Usage (from repo root):
#   ./infra/deploy/bootstrap.sh            # first install / update
# Only Caddy publishes ports; databases are reachable on the internal network only.
# ClickHouse, Meilisearch and MinIO are not used by the API yet (phases 2–5): they live in
# the `full` profile so a small VPS shared with other services isn't loaded for nothing.
name: sonora

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 1g }

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 256m }

  api-migrate:
    build: ../services/api
    image: sonora-api:latest
    command: ["alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      SONORA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *restart
    image: sonora-api:latest
    env_file: [../.env]
    environment:
      SONORA_ENV: prod
      SONORA_LOG_JSON: "true"
      SONORA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SONORA_REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 768m }

  caddy:
    <<: *restart
    image: caddy:2.10-alpine
    environment:
      SONORA_API_ADDRESS: ${SONORA_API_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    # Ports are configurable so the stack can share a host with a VPN that owns 443.
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]

  clickhouse:
    <<: *restart
    profiles: [full]
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: sonora
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d:ro

  meilisearch:
    <<: *restart
    profiles: [full]
    image: getmeili/meilisearch:v1.24
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes: [meilidata:/meili_data]

  minio:
    <<: *restart
    profiles: [full]
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  chdata:
  meilidata:
  miniodata:
