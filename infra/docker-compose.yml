# Local development stack. Usage (from repo root):
#   cp .env.example .env && docker compose -f infra/docker-compose.yml --env-file .env up -d
name: sonora

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 20

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonora}
      POSTGRES_DB: ${POSTGRES_DB:-sonora}
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  s3:
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "/init/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sonora}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sonora-secret}
    ports: ["9000:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs:/init:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]

  storage-init:
    build: ../services/api
    command: ["sonora-api", "init-storage"]
    env_file: [../.env]
    environment:
      SONORA_S3_ENDPOINT_URL: http://s3:8333
    depends_on:
      s3: { condition: service_healthy }
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: sonora
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-sonora}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-sonora}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["8123:8123", "9009:9000"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]

  meilisearch:
    image: getmeili/meilisearch:v1.24
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-sonora-dev-master-key-change-me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes: [meilidata:/meili_data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]

  api-migrate:
    build: ../services/api
    command: ["alembic", "upgrade", "head"]
    env_file: [../.env]
    environment:
      SONORA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sonora}:${POSTGRES_PASSWORD:-sonora}@postgres:5432/${POSTGRES_DB:-sonora}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ../services/api
    env_file: [../.env]
    environment:
      SONORA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sonora}:${POSTGRES_PASSWORD:-sonora}@postgres:5432/${POSTGRES_DB:-sonora}
      SONORA_REDIS_URL: redis://redis:6379/0
      SONORA_QUEUE_URL: redis://redis:6379/1
      SONORA_S3_ENDPOINT_URL: http://s3:8333
      WEB_CONCURRENCY: "2"
    ports: ["8000:8000"]
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  media-worker:
    build:
      context: ../services
      dockerfile: media-worker/Dockerfile
    env_file: [../.env]
    environment:
      SONORA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sonora}:${POSTGRES_PASSWORD:-sonora}@postgres:5432/${POSTGRES_DB:-sonora}
      SONORA_QUEUE_URL: redis://redis:6379/1
      SONORA_S3_ENDPOINT_URL: http://s3:8333
      SONORA_WORKER_PROCESSES: "2"
    depends_on:
      api-migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  s3data:
  chdata:
  meilidata:
